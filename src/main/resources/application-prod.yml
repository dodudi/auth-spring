auth:
  issuer-uri: ${AUTH_ISSUER_URI}
  rsa:
    private-key: ${RSA_PRIVATE_KEY}
    public-key: ${RSA_PUBLIC_KEY}
  allowed-origins: ${OAUTH2_ALLOWED_ORIGINS}
  init:
    admin:
      email: ${INIT_ADMIN_EMAIL}
      password: ${INIT_ADMIN_PASSWORD}
      nickname: ${INIT_ADMIN_NICKNAME:관리자}
    admin-client:
      client-id: ${INIT_ADMIN_CLIENT_ID}
      client-secret: ${INIT_ADMIN_CLIENT_SECRET}
      redirect-uri: ${INIT_ADMIN_REDIRECT_URI}
      post-logout-uri: ${INIT_ADMIN_POST_LOGOUT_URI}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  h2:
    console:
      enabled: false
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
logging:
  level:
    com.auth: INFO
    org.springframework.security: WARN