<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Admin'">Admin</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f4f4f5;
            color: #18181b;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Nav */
        .nav {
            background: #18181b;
            padding: 0 1.5rem;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand { color: #ffffff; font-weight: 600; font-size: 0.9375rem; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 0.75rem; }
        .nav-logout {
            background: transparent;
            border: 1px solid #52525b;
            color: #a1a1aa;
            font-size: 0.8125rem;
            padding: 0.25rem 0.625rem;
            border-radius: 0.375rem;
            cursor: pointer;
        }
        .nav-logout:hover { border-color: #a1a1aa; color: #ffffff; }

        /* Container */
        .container { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }

        /* Card */
        .card {
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 0.75rem;
            padding: 1.5rem;
        }

        /* Page title */
        .page-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 1.25rem; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        thead th {
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #e4e4e7;
            font-weight: 500;
            color: #71717a;
            font-size: 0.8125rem;
        }
        tbody td { padding: 0.625rem 0.75rem; border-bottom: 1px solid #f4f4f5; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: #fafafa; }
        .code { font-family: 'Courier New', monospace; font-size: 0.8125rem; color: #3f3f46; }

        /* Buttons */
        .btn {
            display: inline-block;
            font-size: 0.8125rem;
            font-weight: 500;
            padding: 0.3125rem 0.75rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn-primary { background: #18181b; color: #ffffff; }
        .btn-primary:hover { background: #3f3f46; }
        .btn-secondary { background: #f4f4f5; color: #18181b; border: 1px solid #e4e4e7; }
        .btn-secondary:hover { background: #e4e4e7; }
        .btn-danger { background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; }
        .btn-danger:hover { background: #fee2e2; }
        .btn-warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .btn-warning:hover { background: #fef3c7; }
        .action-group { display: flex; gap: 0.375rem; align-items: center; }
        .action-group form { margin: 0; }

        /* Form */
        .form-group { margin-bottom: 1.125rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
        .label-hint { font-weight: 400; color: #71717a; font-size: 0.8125rem; margin-left: 0.375rem; }
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #e4e4e7;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            color: #18181b;
            outline: none;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus, input[type="number"]:focus, textarea:focus { border-color: #a1a1aa; }
        input[readonly] { background: #f4f4f5; color: #71717a; }
        textarea { resize: vertical; min-height: 80px; font-family: 'Courier New', monospace; font-size: 0.8125rem; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.25rem; }
        .checkbox-label { display: flex; align-items: center; gap: 0.375rem; font-size: 0.875rem; font-weight: 400; cursor: pointer; }
        .checkbox-label input[type="checkbox"] { width: 1rem; height: 1rem; cursor: pointer; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .field-error { color: #ef4444; font-size: 0.8125rem; margin-top: 0.25rem; }

        /* Alert */
        .alert {
            padding: 0.875rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
        .alert-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }

        /* Secret box */
        .secret-box {
            background: #f4f4f5;
            border: 1px solid #e4e4e7;
            border-radius: 0.5rem;
            padding: 0.875rem 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9375rem;
            word-break: break-all;
            letter-spacing: 0.01em;
            margin: 1rem 0;
        }

        /* Top bar above card */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    </style>
</head>

<nav th:fragment="nav">
    <div class="nav">
        <a href="/admin/clients" class="nav-brand">OAuth2 Admin</a>
        <div class="nav-right">
            <form th:action="@{/admin/logout}" method="post">
                <button type="submit" class="nav-logout">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

</html>
