<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout/base :: head('로그인')}"></head>
<body style="background:#ffffff; display:flex; flex-direction:column; min-height:100vh;">

<main style="flex:1; display:flex; align-items:center; justify-content:center; padding:1rem;">
    <div class="card" style="width:100%; max-width:400px;">

        <h1 style="font-size:1.125rem; font-weight:600; margin-bottom:1.5rem;">Admin 로그인</h1>

        <div class="alert alert-warning" th:if="${param.error}" style="margin-bottom:1rem;">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        <div class="alert alert-success" th:if="${param.logout}" style="margin-bottom:1rem;">
            로그아웃 되었습니다.
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="form-group">
                <label for="username">이메일</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus/>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="current-password"/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.5rem;">로그인</button>
        </form>

    </div>
</main>

</body>
</html>
