<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout/base :: head('클라이언트 수정')}"></head>
<body>

<nav th:replace="~{admin/layout/base :: nav}"></nav>

<div class="container" style="max-width:640px;">
    <div class="page-header">
        <h1 class="page-title" style="margin-bottom:0;">클라이언트 수정</h1>
        <a href="/admin/clients" class="btn btn-secondary">← 목록으로</a>
    </div>

    <div class="card">
        <form th:action="@{/admin/clients/{id}/edit(id=${detail.id})}"
              th:object="${form}" method="post">

            <div class="form-group">
                <label>Client ID <span class="label-hint">변경 불가</span></label>
                <input type="text" th:value="${detail.clientId}" readonly/>
            </div>

            <div class="form-group">
                <label for="clientName">클라이언트 이름</label>
                <input type="text" id="clientName" th:field="*{clientName}"/>
                <div class="field-error" th:if="${#fields.hasErrors('clientName')}"
                     th:errors="*{clientName}"></div>
            </div>

            <div class="form-group">
                <label for="loginPageUri">
                    로그인 페이지 URI <span class="label-hint">미인증 시 이 주소로 리디렉트</span>
                </label>
                <input type="text" id="loginPageUri" th:field="*{loginPageUri}"/>
                <div class="field-error" th:if="${#fields.hasErrors('loginPageUri')}"
                     th:errors="*{loginPageUri}"></div>
            </div>

            <div class="form-group">
                <label>Grant Types</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{grantTypes}" value="authorization_code"/>
                        authorization_code
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{grantTypes}" value="refresh_token"/>
                        refresh_token
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{grantTypes}" value="client_credentials"/>
                        client_credentials
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Scopes</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{scopes}" value="openid"/>
                        openid
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{scopes}" value="profile"/>
                        profile
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{scopes}" value="email"/>
                        email
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="redirectUrisRaw">
                    Redirect URIs <span class="label-hint">한 줄에 하나씩 입력</span>
                </label>
                <textarea id="redirectUrisRaw" th:field="*{redirectUrisRaw}"></textarea>
            </div>

            <div class="form-group">
                <label for="postLogoutRedirectUrisRaw">
                    Post-Logout Redirect URIs <span class="label-hint">한 줄에 하나씩 입력</span>
                </label>
                <textarea id="postLogoutRedirectUrisRaw" th:field="*{postLogoutRedirectUrisRaw}"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="accessTokenTtlMinutes">
                        Access Token TTL <span class="label-hint">분 (1-1440)</span>
                    </label>
                    <input type="number" id="accessTokenTtlMinutes"
                           th:field="*{accessTokenTtlMinutes}" min="1" max="1440"/>
                    <div class="field-error" th:if="${#fields.hasErrors('accessTokenTtlMinutes')}"
                         th:errors="*{accessTokenTtlMinutes}"></div>
                </div>
                <div class="form-group">
                    <label for="refreshTokenTtlDays">
                        Refresh Token TTL <span class="label-hint">일 (1-365)</span>
                    </label>
                    <input type="number" id="refreshTokenTtlDays"
                           th:field="*{refreshTokenTtlDays}" min="1" max="365"/>
                    <div class="field-error" th:if="${#fields.hasErrors('refreshTokenTtlDays')}"
                         th:errors="*{refreshTokenTtlDays}"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" th:field="*{requirePkce}"/>
                    PKCE 필수 (Public Client / SPA 권장)
                </label>
            </div>

            <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
                <button type="submit" class="btn btn-primary">저장</button>
                <a href="/admin/clients" class="btn btn-secondary">취소</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
