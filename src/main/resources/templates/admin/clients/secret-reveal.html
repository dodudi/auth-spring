<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout/base :: head('Client Secret')}"></head>
<body>

<nav th:replace="~{admin/layout/base :: nav}"></nav>

<div class="container" style="max-width:560px;">
    <div class="card">

        <div style="margin-bottom:1.25rem;">
            <span style="display:inline-block; font-size:0.75rem; font-weight:500; color:#d97706;
                         background:#fffbeb; border:1px solid #fde68a; border-radius:9999px;
                         padding:0.2rem 0.65rem; margin-bottom:0.875rem;">
                1회 표시
            </span>
            <h1 style="font-size:1.125rem; font-weight:600; margin-bottom:0.375rem;">Client Secret 발급 완료</h1>
            <p style="font-size:0.875rem; color:#71717a;">
                아래 Secret은 지금만 확인할 수 있습니다. 반드시 지금 복사하여 안전한 곳에 저장하세요.
            </p>
        </div>

        <div class="alert alert-warning">
            이 페이지를 닫거나 새로고침하면 Secret을 다시 볼 수 없습니다.<br>
            분실 시 Secret을 재발급해야 하며, 기존 Secret은 즉시 무효화됩니다.
        </div>

        <div style="margin-bottom:1rem;">
            <label style="display:block; font-size:0.875rem; font-weight:500; margin-bottom:0.375rem;">Client ID</label>
            <div class="secret-box" th:text="${reveal.clientId}" style="font-size:0.875rem; color:#52525b;"></div>
        </div>

        <div style="margin-bottom:1.25rem;">
            <label style="display:block; font-size:0.875rem; font-weight:500; margin-bottom:0.375rem;">Client Secret</label>
            <div class="secret-box" id="secretValue" th:text="${reveal.rawSecret}"></div>
            <button class="btn btn-secondary" onclick="copySecret()" style="margin-top:0.5rem;">
                클립보드에 복사
            </button>
        </div>

        <a href="/admin/clients" class="btn btn-primary">목록으로 돌아가기</a>

    </div>
</div>

<script>
    function copySecret() {
        const text = document.getElementById('secretValue').textContent.trim();
        navigator.clipboard.writeText(text).then(() => {
            alert('Secret이 클립보드에 복사되었습니다.');
        });
    }
</script>

</body>
</html>
