apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-spring
  namespace: auth-spring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-spring
  template:
    metadata:
      labels:
        app: auth-spring
    spec:
      imagePullSecrets:
        - name: registry-cred          # 프라이빗 레지스트리 pull 인증
      containers:
        - name: auth-spring
          image: registry.rudy.it.kr/auth-spring:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: auth-spring-secret   # DB_URL, REDIS_HOST 등 앱 환경변수
          readinessProbe:
            httpGet:
              path: /actuator/health       # actuator 의존성이 있으니 헬스체크로 활용
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-spring
  namespace: auth-spring
spec:
  selector:
    app: auth-spring
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auth-spring
  namespace: auth-spring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.rudy.it.kr`)
      kind: Rule
      services:
        - name: auth-spring
          port: 8080
  tls:
    certResolver: letsencrypt