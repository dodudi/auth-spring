server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: auth-spring
    static_configs:
      - targets:
          - localhost
        labels:
          app: auth-spring
          env: prod
          __path__: /logs/auth-spring.log
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
